# Bake into image at /comfyui/extra_model_paths.yaml
# Serverless network volume mounts at /runpod-volume
# Layout on volume h3-models (yxvhr288kf):
#   models/diffusion_models/
#   models/text_encoders/
#   models/vae/
#   models/latent_upscale_models/
#   models/vae_approx/
#   models/rife/   (flownet.pkl)
#   models/loras/  (optional)
# Also support Krea-style nested ComfyUI/models if present.

runpod_h3_volume:
  base_path: /runpod-volume
  checkpoints: models/checkpoints/
  clip: models/clip/
  clip_vision: models/clip_vision/
  configs: models/configs/
  controlnet: models/controlnet/
  embeddings: models/embeddings/
  loras: models/loras/
  upscale_models: models/upscale_models/
  vae: models/vae/
  unet: models/unet/
  diffusion_models: models/diffusion_models/
  text_encoders: models/text_encoders/
  latent_upscale_models: models/latent_upscale_models/
  vae_approx: models/vae_approx/
  # RIFE / VFI often looks under custom_nodes path; keep file discoverable:
  # models/rife/flownet.pkl

# Optional alias if volume was filled as /ComfyUI/models/* (Krea pattern)
runpod_h3_comfy_nested:
  base_path: /runpod-volume/ComfyUI
  diffusion_models: models/diffusion_models/
  text_encoders: models/text_encoders/
  vae: models/vae/
  latent_upscale_models: models/latent_upscale_models/
  vae_approx: models/vae_approx/
  loras: models/loras/
  unet: models/unet/
  clip: models/clip/
