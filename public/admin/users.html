<!DOCTYPE html>
<!--
  ============================================================
  public/admin/users.html — Admin: Kelola User
  ============================================================
  Fitur:
  - Tabel daftar semua user dengan search
  - Modal buat user baru
  - Toggle aktif/nonaktif user
  ============================================================
-->
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola User — Admin Krea2 Edit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>

<body class="dark bg-slate-900 min-h-screen text-white">
  <div class="flex min-h-screen">

    <!-- Sidebar (sama dengan dashboard) -->
    <aside class="w-56 shrink-0 bg-slate-800 border-r border-slate-700 flex flex-col">
      <div class="p-4 border-b border-slate-700">
        <div class="flex items-center gap-2 font-bold text-sm">
          <span class="w-7 h-7 rounded-lg bg-orange-500 flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
          </span>
          Admin Panel
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1 text-sm">
        <a href="/admin/dashboard.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">🏠 Dashboard</a>
        <a href="/admin/users.html"     class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg bg-orange-500/10 text-orange-400">👥 Kelola User</a>
        <a href="/admin/credits.html"   class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">💰 Kelola Kredit</a>
      </nav>
      <div class="p-3 border-t border-slate-700">
        <div class="text-xs text-slate-400 mb-2 px-2 truncate" id="admin-email"></div>
        <button id="btn-logout" class="flex items-center gap-2 px-3 py-2 rounded-lg text-red-400 hover:bg-red-500/10 w-full text-sm transition-colors">
          🚪 Logout
        </button>
      </div>
    </aside>

    <!-- Konten Utama -->
    <main class="flex-1 overflow-auto">
      <div class="border-b border-slate-700 px-6 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold">Kelola User</h1>
          <p class="text-slate-400 text-sm">Buat, aktifkan, atau nonaktifkan user</p>
        </div>
        <button onclick="openCreateModal()"
          class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-colors flex items-center gap-1.5">
          + Tambah User
        </button>
      </div>

      <div class="p-6">
        <!-- Search -->
        <div class="mb-4">
          <input
            type="text" id="search-input"
            placeholder="Cari berdasarkan email..."
            class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>

        <!-- Tabel User -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-700/50">
                <tr>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Email</th>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Kredit</th>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Status</th>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Bergabung</th>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Aksi</th>
                </tr>
              </thead>
              <tbody id="users-table" class="divide-y divide-slate-700/50">
                <tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">Memuat...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Buat User Baru -->
  <div id="modal-create" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-semibold text-lg">Tambah User Baru</h3>
        <button onclick="closeCreateModal()" class="text-slate-400 hover:text-white transition-colors">✕</button>
      </div>

      <!-- Alert error -->
      <div id="modal-error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl">
        <p id="modal-error-msg" class="text-red-400 text-sm"></p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
          <input type="email" id="new-email" placeholder="user@email.com"
            class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
          <input type="password" id="new-password" placeholder="Minimal 8 karakter"
            class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Kredit Awal</label>
          <input type="number" id="new-credits" value="0" min="0"
            class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-orange-500" />
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="closeCreateModal()" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-colors text-sm">
          Batal
        </button>
        <button id="btn-create-user" onclick="createUser()"
          class="flex-1 py-2.5 bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white font-semibold rounded-xl transition-colors text-sm">
          Buat User
        </button>
      </div>
    </div>
  </div>

  <script>
    let allUsers = [];

    // Muat daftar user
    async function loadUsers() {
      const res  = await fetch('/api/admin/users?limit=100', { credentials: 'include' });
      const data = await res.json();
      if (!res.ok || !data.success) return;

      allUsers = data.data.users;
      renderUsers(allUsers);
    }

    // Render tabel user
    function renderUsers(users) {
      const tbody = document.getElementById('users-table');
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">Tidak ada user</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => `
        <tr class="hover:bg-slate-700/30 transition-colors">
          <td class="px-4 py-3">
            <div class="font-medium text-sm">${u.email}</div>
          </td>
          <td class="px-4 py-3">
            <span class="text-orange-400 font-semibold">${u.credits}</span>
            <span class="text-slate-500 text-xs"> kredit</span>
          </td>
          <td class="px-4 py-3">
            ${u.is_active
              ? '<span class="px-2 py-0.5 bg-green-500/20 text-green-400 text-xs rounded-md border border-green-500/30">Aktif</span>'
              : '<span class="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs rounded-md border border-red-500/30">Nonaktif</span>'
            }
          </td>
          <td class="px-4 py-3 text-slate-400 text-xs">
            ${new Date(u.created_at).toLocaleDateString('id-ID')}
          </td>
          <td class="px-4 py-3">
            <button
              onclick="toggleStatus('${u.id}', ${u.is_active})"
              class="text-xs px-3 py-1.5 rounded-lg transition-colors ${u.is_active
                ? 'bg-red-500/10 text-red-400 hover:bg-red-500/20'
                : 'bg-green-500/10 text-green-400 hover:bg-green-500/20'}"
            >
              ${u.is_active ? 'Nonaktifkan' : 'Aktifkan'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    // Toggle status user
    async function toggleStatus(userId, currentStatus) {
      const newStatus = currentStatus ? 0 : 1;
      const action = newStatus ? 'aktifkan' : 'nonaktifkan';
      if (!confirm(`Yakin ingin ${action} user ini?`)) return;

      const res = await fetch(`/api/admin/users/${userId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ is_active: newStatus }),
      });

      if (res.ok) await loadUsers();
      else alert('Gagal mengubah status user.');
    }

    // Buka modal create
    function openCreateModal() {
      document.getElementById('modal-create').classList.remove('hidden');
      document.getElementById('modal-error').classList.add('hidden');
      document.getElementById('new-email').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('new-credits').value = '0';
    }

    function closeCreateModal() {
      document.getElementById('modal-create').classList.add('hidden');
    }

    // Buat user baru
    async function createUser() {
      const email          = document.getElementById('new-email').value.trim();
      const password       = document.getElementById('new-password').value;
      const initialCredits = parseInt(document.getElementById('new-credits').value) || 0;

      const btn = document.getElementById('btn-create-user');
      btn.disabled = true;
      btn.textContent = 'Membuat...';

      const res = await fetch('/api/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password, initial_credits: initialCredits }),
      });

      const data = await res.json();
      btn.disabled = false;
      btn.textContent = 'Buat User';

      if (res.ok && data.success) {
        closeCreateModal();
        await loadUsers();
        alert(`User ${email} berhasil dibuat!`);
      } else {
        document.getElementById('modal-error').classList.remove('hidden');
        document.getElementById('modal-error-msg').textContent = data.message || 'Gagal membuat user.';
      }
    }

    // Search filter (client-side)
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allUsers.filter(u => u.email.toLowerCase().includes(q));
      renderUsers(filtered);
    });

    // Inisialisasi
    (async () => {
      const meRes = await fetch('/api/auth/me', { credentials: 'include' });
      if (!meRes.ok) { window.location.href = '/admin/login.html'; return; }
      const me = (await meRes.json()).data;
      if (me.role !== 'admin') { window.location.href = '/admin/login.html'; return; }
      document.getElementById('admin-email').textContent = me.email;
      await loadUsers();
    })();

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/admin/login.html';
    });
  </script>
</body>
</html>
