<!DOCTYPE html>
<!--
  ============================================================
  public/admin/dashboard.html — Admin Dashboard Overview
  ============================================================
  Halaman utama admin dengan:
  - Statistik utama (user, job, GPU)
  - Tabel job terbaru dari semua user
  - Status GPU pool
  - Sidebar navigasi admin
  ============================================================
-->
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Krea2 Edit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.15s ease-in; }
    body.authorized { opacity: 1; }
    .sidebar-link { @apply flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm transition-colors; }
    .sidebar-link.active { @apply bg-orange-500/10 text-orange-400; }
    .sidebar-link:not(.active) { @apply text-slate-400 hover:bg-slate-700 hover:text-white; }
  </style>
  <script>
    // Guard langsung di head — cegah glitch/flicker sebelum auth diverifikasi
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) throw new Error('unauthorized');
        const user = (await res.json()).data;
        if (!user || user.role !== 'admin') throw new Error('forbidden');
        
        // Terverifikasi admin — tampilkan body
        const reveal = () => document.body && document.body.classList.add('authorized');
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', reveal);
        } else {
          reveal();
        }
      } catch {
        window.location.replace('/admin/login.html');
      }
    })();
  </script>
</head>

<body class="dark bg-slate-900 min-h-screen text-white">

  <div class="flex min-h-screen">

    <!-- ==================== SIDEBAR ==================== -->
    <aside class="w-56 shrink-0 bg-slate-800 border-r border-slate-700 flex flex-col">

      <!-- Logo -->
      <div class="p-4 border-b border-slate-700">
        <div class="flex items-center gap-2 font-bold">
          <span class="w-7 h-7 rounded-lg bg-orange-500 flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
          </span>
          Admin Panel
        </div>
      </div>

      <!-- Navigasi -->
      <nav class="flex-1 p-3 space-y-1">
        <a href="/admin/dashboard.html" class="sidebar-link active">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Dashboard
        </a>
        <a href="/admin/users.html" class="sidebar-link">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
          </svg>
          Kelola User
        </a>
        <a href="/admin/credits.html" class="sidebar-link">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Kelola Kredit
        </a>
        <a href="#gpu-section" class="sidebar-link" onclick="scrollToGPU()">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 3.75H6.912a2.25 2.25 0 00-2.15 1.588L2.35 13.177a2.25 2.25 0 00-.1.661V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 00-2.15-1.588H15M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859M12 3v8.25m0 0l-3-3m3 3l3-3" />
          </svg>
          GPU Status
        </a>
      </nav>

      <!-- Admin info + logout -->
      <div class="p-3 border-t border-slate-700">
        <div class="text-xs text-slate-400 mb-2 px-2 truncate" id="admin-email">loading...</div>
        <button id="btn-logout"
          class="sidebar-link text-red-400 hover:bg-red-500/10 hover:text-red-300 w-full">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- ==================== KONTEN UTAMA ==================== -->
    <main class="flex-1 overflow-auto">

      <!-- Header -->
      <div class="border-b border-slate-700 px-6 py-4">
        <h1 class="text-xl font-bold">Dashboard</h1>
        <p class="text-slate-400 text-sm mt-0.5">Overview platform Krea2 Edit</p>
      </div>

      <div class="p-6 space-y-6">

        <!-- ==================== STAT CARDS ==================== -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">

          <!-- Stat: Total User -->
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
              <span class="text-slate-400 text-xs uppercase tracking-wide">User Aktif</span>
              <div class="w-8 h-8 bg-blue-500/10 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
                </svg>
              </div>
            </div>
            <p class="text-3xl font-bold" id="stat-users">-</p>
          </div>

          <!-- Stat: Job Hari Ini -->
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
              <span class="text-slate-400 text-xs uppercase tracking-wide">Generate Hari Ini</span>
              <div class="w-8 h-8 bg-orange-500/10 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
                </svg>
              </div>
            </div>
            <p class="text-3xl font-bold" id="stat-jobs-today">-</p>
          </div>

          <!-- Stat: Pending Jobs -->
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
              <span class="text-slate-400 text-xs uppercase tracking-wide">Pending/Processing</span>
              <div class="w-8 h-8 bg-yellow-500/10 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
            </div>
            <p class="text-3xl font-bold" id="stat-pending">-</p>
          </div>

          <!-- Stat: GPU Online -->
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
              <span class="text-slate-400 text-xs uppercase tracking-wide">GPU Online</span>
              <div class="w-8 h-8 bg-green-500/10 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2" />
                </svg>
              </div>
            </div>
            <p class="text-3xl font-bold" id="stat-gpu">-</p>
          </div>

        </div><!-- End Stat Cards -->

        <!-- ==================== TABEL JOB TERBARU ==================== -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-700 flex items-center justify-between">
            <h2 class="font-semibold">Job Terbaru</h2>
            <span class="text-xs text-slate-400">10 terakhir dari semua user</span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-700/50">
                <tr>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Waktu</th>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">User</th>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Status</th>
                  <th class="px-4 py-3 text-left text-xs text-slate-400 font-medium">Prompt</th>
                </tr>
              </thead>
              <tbody id="jobs-table" class="divide-y divide-slate-700/50">
                <tr>
                  <td colspan="4" class="px-4 py-8 text-center text-slate-500 text-sm">Memuat...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ==================== GPU STATUS ==================== -->
        <div id="gpu-section" class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-700 flex items-center justify-between">
            <h2 class="font-semibold">GPU Status</h2>
            <button onclick="loadGpuStatus()" class="text-xs text-orange-400 hover:text-orange-300 transition-colors">
              ↺ Refresh
            </button>
          </div>
          <div id="gpu-list" class="p-4">
            <p class="text-slate-500 text-sm text-center py-4">Memuat status GPU...</p>
          </div>
        </div>

      </div><!-- End p-6 -->
    </main>

  </div><!-- End flex -->

  <script>
    // ============================================================
    // Script Admin Dashboard
    // ============================================================

    /**
     * Format tanggal singkat
     */
    function formatDate(iso) {
      if (!iso) return '-';
      return new Date(iso).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    /**
     * Badge status job
     */
    function statusBadge(status) {
      const map = {
        pending:    'bg-yellow-500/20 text-yellow-400',
        processing: 'bg-blue-500/20 text-blue-400',
        done:       'bg-green-500/20 text-green-400',
        failed:     'bg-red-500/20 text-red-400',
      };
      return `<span class="px-2 py-0.5 rounded-md text-xs font-medium ${map[status] || 'bg-slate-500/20 text-slate-400'}">${status}</span>`;
    }

    /**
     * Muat data dashboard dari API
     */
    async function loadDashboard() {
      const res  = await fetch('/api/admin/dashboard', { credentials: 'include' });
      const data = await res.json();

      if (!res.ok || !data.success) return;

      const { stats, recentJobs, gpuPool } = data.data;

      // Update stat cards
      document.getElementById('stat-users').textContent     = stats.totalActiveUsers;
      document.getElementById('stat-jobs-today').textContent = stats.totalJobsToday;
      document.getElementById('stat-pending').textContent   = stats.pendingJobs + stats.processingJobs;
      document.getElementById('stat-gpu').textContent       = stats.gpuOnline;

      // Render tabel job terbaru
      const tbody = document.getElementById('jobs-table');
      if (recentJobs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500 text-sm">Belum ada job</td></tr>';
      } else {
        tbody.innerHTML = recentJobs.map(job => `
          <tr class="hover:bg-slate-700/30 transition-colors">
            <td class="px-4 py-3 text-slate-400 text-xs whitespace-nowrap">${formatDate(job.created_at)}</td>
            <td class="px-4 py-3 text-sm max-w-32 truncate">${job.user_email}</td>
            <td class="px-4 py-3">${statusBadge(job.status)}</td>
            <td class="px-4 py-3 text-slate-400 text-xs max-w-xs truncate">${job.positive_prompt || '-'}</td>
          </tr>
        `).join('');
      }

      // Render GPU pool
      renderGpuList(gpuPool);
    }

    /**
     * Load GPU status (bisa refresh manual)
     */
    async function loadGpuStatus() {
      document.getElementById('gpu-list').innerHTML = '<p class="text-slate-500 text-sm text-center py-4">Memuat...</p>';
      const res  = await fetch('/api/admin/gpu/status', { credentials: 'include' });
      const data = await res.json();
      if (res.ok && data.success) {
        renderGpuList(data.data.gpus);
      }
    }

    /**
     * Render daftar GPU
     */
    function renderGpuList(gpus) {
      const container = document.getElementById('gpu-list');
      if (!gpus || gpus.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">Tidak ada GPU yang online</p>';
        return;
      }
      container.innerHTML = gpus.map(gpu => `
        <div class="flex items-center justify-between py-3 border-b border-slate-700/50 last:border-0">
          <div>
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 bg-green-400 rounded-full"></span>
              <span class="text-sm font-medium">${gpu.gpuName || 'GPU'} #${gpu.id}</span>
            </div>
            <p class="text-xs text-slate-400 mt-0.5 ml-4">${gpu.url}</p>
          </div>
          <div class="text-right">
            <span class="text-xs bg-slate-700 px-2 py-0.5 rounded">Queue: ${gpu.queueLength === Infinity ? '?' : gpu.queueLength}</span>
          </div>
        </div>
      `).join('');
    }

    function scrollToGPU() {
      document.getElementById('gpu-section').scrollIntoView({ behavior: 'smooth' });
    }

    // ============================================================
    // Inisialisasi
    // ============================================================
    (async () => {
      // Cek auth admin
      const meRes = await fetch('/api/auth/me', { credentials: 'include' });
      if (!meRes.ok) { window.location.href = '/admin/login.html'; return; }
      const me = (await meRes.json()).data;
      if (me.role !== 'admin') { window.location.href = '/admin/login.html'; return; }

      document.getElementById('admin-email').textContent = me.email;
      await loadDashboard();

      // Auto-refresh setiap 30 detik
      setInterval(loadDashboard, 30000);
    })();

    // Tombol Logout
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/admin/login.html';
    });
  </script>

</body>
</html>
