<!DOCTYPE html>
<!--
  ============================================================
  public/admin/login.html — Jakarta Naughty Admin Gate (English)
  ============================================================
-->
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Jakarta Naughty</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#FF788D',
              dark: '#e0536b',
              light: '#FFDADA',
              tint: '#FFF2F2',
              emerald: '#165823',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080c14;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 120, 141, 0.2);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-100">

  <!-- Ambient Glow Background -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-[#FF788D]/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative w-full max-w-sm text-center z-10">

    <!-- Admin Badge -->
    <div class="inline-flex items-center gap-2 bg-[#FF788D]/10 border border-[#FF788D]/30 text-[#FFDADA] text-xs font-bold px-4 py-1.5 rounded-full mb-6 shadow-lg shadow-[#FF788D]/10">
      <svg class="w-3.5 h-3.5 text-brand" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
      </svg>
      ADMINISTRATOR GATE
    </div>

    <!-- Brand Header -->
    <div class="mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-[#FF788D] to-[#e0536b] text-white font-extrabold text-2xl shadow-xl shadow-[#FF788D]/25 mb-3">
        JN
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">Jakarta Naughty</h1>
      <p class="text-[#FFDADA] text-xs font-medium mt-1">Administrator Control Panel</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-3xl p-7 shadow-2xl">

      <!-- Error Message -->
      <div id="error-box" class="hidden mb-5 p-3 bg-red-950/60 border border-red-500/40 rounded-xl text-left">
        <p id="error-msg" class="text-red-300 text-xs font-medium"></p>
      </div>

      <!-- Admin Login Form -->
      <form id="admin-login-form" class="space-y-4 text-left mb-6">
        <div>
          <label for="admin-username-input" class="block text-xs font-bold text-slate-300 mb-1.5">Username</label>
          <input
            type="text"
            id="admin-username-input"
            required
            autocomplete="username"
            placeholder="admin username"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand text-xs font-medium"
          />
        </div>
        <div>
          <label for="admin-pass-input" class="block text-xs font-bold text-slate-300 mb-1.5">Password</label>
          <input
            type="password"
            id="admin-pass-input"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand text-xs font-medium"
          />
        </div>
        <button
          type="submit"
          id="btn-admin-login"
          class="w-full py-3 bg-gradient-to-r from-[#FF788D] to-[#e0536b] hover:opacity-90 text-white font-bold rounded-xl transition-all text-xs shadow-lg shadow-[#FF788D]/25 mt-2"
        >
          <span id="btn-admin-text">Sign In to Admin Panel</span>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="pt-4 border-t border-slate-800">
        <p class="text-slate-500 text-[11px] leading-relaxed">
          🔒 Protected by <strong class="text-slate-400">Stealth Shield</strong>. Access attempts and IP addresses are monitored.
        </p>
      </div>
    </div>

    <!-- Link to Member Login -->
    <p class="mt-6 text-slate-500 text-xs">
      Not an admin?
      <a href="/login.html" class="text-brand hover:text-brand-light transition-colors font-semibold">Open Member Login →</a>
    </p>

  </div>

  <script>
    // Check if already authenticated as admin
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          if (data.data?.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          }
        }
      } catch (_) {}
    })();

    // Handle Form Submit
    const adminForm  = document.getElementById('admin-login-form');
    const userInput  = document.getElementById('admin-username-input');
    const passInput  = document.getElementById('admin-pass-input');
    const btnSubmit  = document.getElementById('btn-admin-login');
    const btnText    = document.getElementById('btn-admin-text');
    const errorBox   = document.getElementById('error-box');
    const errorMsg   = document.getElementById('error-msg');

    adminForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');

      const username = userInput.value.trim();
      const password = passInput.value;

      btnSubmit.disabled = true;
      btnText.textContent = 'Verifying credentials...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (data.data?.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else {
            errorBox.classList.remove('hidden');
            errorMsg.textContent = '⚠️ This account does not have administrator privileges.';
          }
        } else {
          errorBox.classList.remove('hidden');
          errorMsg.textContent = data.message || 'Authentication failed.';
        }
      } catch (err) {
        errorBox.classList.remove('hidden');
        errorMsg.textContent = 'Server connection failure.';
      } finally {
        btnSubmit.disabled = false;
        btnText.textContent = 'Sign In to Admin Panel';
      }
    });
  </script>
</body>
</html>
