<!DOCTYPE html>
<!--
  ============================================================
  public/login.html — Halaman Login User
  ============================================================
  Halaman ini adalah pintu masuk untuk semua user biasa.
  Tidak ada registrasi — akun dibuat oleh admin.

  Flow:
  1. Cek apakah sudah login via GET /api/auth/me
  2. Jika sudah login → redirect ke /dashboard.html
  3. Jika belum → tampilkan form login
  4. Submit form → POST /api/auth/login
  5. Berhasil → redirect ke /dashboard.html
  ============================================================
-->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Krea2 Edit</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Konfigurasi Tailwind — tema custom
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: '#f97316', // orange-500
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Animasi fade-in untuk card login */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }

    /* Loading spinner */
    .spinner {
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      width: 18px; height: 18px;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="dark bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <!-- Background dekoratif -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-orange-500 opacity-5 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-orange-400 opacity-5 rounded-full blur-3xl"></div>
  </div>

  <!-- Card Login -->
  <div class="fade-in-up w-full max-w-md relative">

    <!-- Logo & Judul -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500 mb-4 shadow-lg shadow-orange-500/30">
        <!-- Icon gambar/AI -->
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Krea2 Edit</h1>
      <p class="text-slate-400 mt-1 text-sm">Masuk untuk mulai generate gambar</p>
    </div>

    <!-- Form Login -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">

      <!-- Pesan Error (tersembunyi by default) -->
      <div id="error-box" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg">
        <p id="error-msg" class="text-red-400 text-sm text-center"></p>
      </div>

      <form id="login-form" class="space-y-4" novalidate>

        <!-- Field Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required
            class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white placeholder-slate-500
                   focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent
                   transition-all duration-200 text-sm"
          />
        </div>

        <!-- Field Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">
            Password
          </label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white placeholder-slate-500
                     focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent
                     transition-all duration-200 text-sm pr-12"
            />
            <!-- Toggle show/hide password -->
            <button
              type="button"
              id="toggle-password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 transition-colors"
              aria-label="Tampilkan/sembunyikan password"
            >
              <!-- Icon mata (tersembunyi) -->
              <svg id="eye-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Tombol Login -->
        <button
          type="submit"
          id="btn-login"
          class="w-full py-3 px-4 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-xl
                 transition-all duration-200 flex items-center justify-center gap-2
                 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 focus:ring-offset-slate-800
                 disabled:opacity-50 disabled:cursor-not-allowed mt-2"
        >
          <span id="btn-text">Masuk</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>

      </form>

      <!-- Info footer -->
      <p class="text-center text-slate-500 text-xs mt-6">
        Belum punya akun? Hubungi admin untuk mendapatkan akses.
      </p>
    </div>

  </div>

  <script>
    // ============================================================
    // Script halaman login
    // ============================================================

    // Referensi elemen DOM
    const form        = document.getElementById('login-form');
    const emailInput  = document.getElementById('email');
    const passInput   = document.getElementById('password');
    const btnLogin    = document.getElementById('btn-login');
    const btnText     = document.getElementById('btn-text');
    const btnSpinner  = document.getElementById('btn-spinner');
    const errorBox    = document.getElementById('error-box');
    const errorMsg    = document.getElementById('error-msg');
    const togglePass  = document.getElementById('toggle-password');

    /**
     * Tampilkan pesan error di kotak merah
     * @param {string} msg - Pesan error
     */
    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    /**
     * Sembunyikan pesan error
     */
    function hideError() {
      errorBox.classList.add('hidden');
    }

    /**
     * Set tombol ke state loading (disable + tampilkan spinner)
     * @param {boolean} isLoading
     */
    function setLoading(isLoading) {
      btnLogin.disabled = isLoading;
      btnText.textContent = isLoading ? 'Memproses...' : 'Masuk';
      btnSpinner.classList.toggle('hidden', !isLoading);
    }

    // Toggle show/hide password
    togglePass.addEventListener('click', () => {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
    });

    // Cek apakah sudah login saat halaman dimuat
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          // Sudah login — redirect ke dashboard
          window.location.href = '/dashboard.html';
        }
      } catch (e) {
        // Belum login atau error network — tetap di halaman login
      }
    })();

    // Handle submit form login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email    = emailInput.value.trim();
      const password = passInput.value;

      // Validasi sederhana di client-side
      if (!email || !password) {
        return showError('Email dan password wajib diisi.');
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include', // Penting: agar cookie diterima
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Login berhasil — redirect ke dashboard
          window.location.href = '/dashboard.html';
        } else {
          // Tampilkan pesan error dari server
          showError(data.message || 'Login gagal. Coba lagi.');
        }
      } catch (err) {
        showError('Tidak bisa terhubung ke server. Periksa koneksi internet kamu.');
      } finally {
        setLoading(false);
      }
    });
  </script>

</body>
</html>
