<!DOCTYPE html>
<!--
  ============================================================
  public/login.html — Jakarta Naughty Member Login
  ============================================================
-->
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Member — Jakarta Naughty</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#FF788D',
              dark: '#e0536b',
              light: '#FFDADA',
              tint: '#FFF2F2',
              emerald: '#165823',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080c14;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 120, 141, 0.18);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-100">

  <!-- Ambient Glow -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-[#FF788D]/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative w-full max-w-sm text-center z-10">

    <!-- Logo & Brand Header -->
    <div class="mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-[#FF788D] to-[#e0536b] text-white font-extrabold text-2xl shadow-xl shadow-[#FF788D]/25 mb-4">
        JN
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Jakarta Naughty</h1>
      <p class="text-[#FFDADA] text-xs font-semibold mt-1 tracking-wide uppercase">Edit Photo Studio</p>
    </div>

    <!-- Card Login -->
    <div class="glass-card rounded-3xl p-8 shadow-2xl">

      <h2 class="text-lg font-bold text-white mb-2">Masuk ke Akun Member</h2>
      <p class="text-xs text-slate-400 mb-6">Masukkan email & password untuk mulai generate foto.</p>

      <!-- Error Alert -->
      <div id="error-box" class="hidden mb-5 p-3.5 bg-red-950/60 border border-red-500/40 rounded-xl text-left">
        <p id="error-msg" class="text-red-300 text-xs font-medium"></p>
      </div>

      <!-- Form Login -->
      <form id="login-form" class="space-y-4 text-left">
        <div>
          <label for="email" class="block text-xs font-bold text-slate-300 mb-1.5">Email</label>
          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="nama@email.com"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand text-xs font-medium"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-bold text-slate-300">Password</label>
            <button type="button" id="toggle-password" class="text-[11px] text-[#FFDADA] hover:text-brand transition-colors">
              Lihat
            </button>
          </div>
          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand text-xs font-medium"
          />
        </div>

        <button
          type="submit"
          id="btn-login"
          class="w-full py-3 bg-gradient-to-r from-[#FF788D] to-[#e0536b] hover:opacity-90 text-white font-bold rounded-xl transition-all text-xs shadow-lg shadow-[#FF788D]/25 mt-3 flex items-center justify-center gap-2"
        >
          <span id="btn-text">Masuk Sekarang</span>
          <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="mt-6 pt-5 border-t border-slate-800 text-center">
        <p class="text-slate-500 text-[11px]">
          Belum memiliki akun atau kuota kredit?
        </p>
        <p class="text-[#FFDADA] text-xs font-semibold mt-1">
          Hubungi Admin untuk pendaftaran akun.
        </p>
      </div>

    </div>

    <!-- Copyright -->
    <p class="mt-6 text-slate-600 text-xs">
      &copy; 2026 Jakarta Naughty Studio. All rights reserved.
    </p>

  </div>

  <script>
    const form        = document.getElementById('login-form');
    const emailInput  = document.getElementById('email');
    const passInput   = document.getElementById('password');
    const btnLogin    = document.getElementById('btn-login');
    const btnText     = document.getElementById('btn-text');
    const btnSpinner  = document.getElementById('btn-spinner');
    const errorBox    = document.getElementById('error-box');
    const errorMsg    = document.getElementById('error-msg');
    const togglePass  = document.getElementById('toggle-password');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    function setLoading(isLoading) {
      btnLogin.disabled = isLoading;
      btnText.textContent = isLoading ? 'Memproses...' : 'Masuk Sekarang';
      btnSpinner.classList.toggle('hidden', !isLoading);
    }

    togglePass.addEventListener('click', () => {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
      togglePass.textContent = isPassword ? 'Sembunyikan' : 'Lihat';
    });

    // Cek apakah sudah login
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const user = (await res.json()).data;
          if (user && user.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        }
      } catch (_) {}
    })();

    // Handle Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email    = emailInput.value.trim();
      const password = passInput.value;

      if (!email || !password) {
        return showError('Email dan password wajib diisi.');
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (data.data?.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        } else {
          showError(data.message || 'Login gagal. Periksa kembali email dan password Anda.');
        }
      } catch (err) {
        showError('Tidak bisa terhubung ke server. Periksa koneksi internet Anda.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
