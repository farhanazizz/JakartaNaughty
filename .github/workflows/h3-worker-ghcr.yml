# Builds H3 RunPod worker image to GHCR.
# Does NOT deploy Coolify / does NOT touch the website Dockerfile.
# Triggers only on this workflow file or workers/h3-comfyui/** changes.
name: h3-worker-ghcr

on:
  push:
    branches:
      - feat/h3-runpod-worker
    paths:
      - "workers/h3-comfyui/**"
      - ".github/workflows/h3-worker-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          echo "image=ghcr.io/farhanazizz/h3-runpod" >> "$GITHUB_OUTPUT"
          echo "tag=dev" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workers/h3-comfyui
          file: workers/h3-comfyui/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
